[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tuxkeystoys"
version = "1.0.0"
description = "TuxKeysToys - Laptop internal keyboard remapper utility for Linux."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "customtkinter>=5.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0"
]

[project.scripts]
tuxkeystoys = "tuxkeystoys.main:main"
